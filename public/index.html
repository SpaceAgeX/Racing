<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111417" />
    <title>Beggar's Grand Prix</title>
    <link rel="stylesheet" href="/styles.css?v=menu-refinements-4" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body data-auth-state="pending">
    <main id="home-screen" class="screen screen-home" aria-label="Lobby browser"></main>
    <main id="lobby-screen" class="screen screen-lobby" hidden aria-label="Lobby settings"></main>
    <main id="race-screen" class="screen screen-race" hidden aria-label="Active race">
      <header class="race-toolbar">
        <div>
          <strong id="race-room-name">Race room</strong>
          <span id="race-room-status">Waiting for race to start</span>
        </div>
        <div id="performance-stats" class="performance-stats" aria-label="Performance and network latency">
          <span>FPS <output data-fps>—</output></span>
          <span>Ping <output data-ping>—</output></span>
        </div>
        <button id="lobby-panel-toggle" type="button" hidden>Lobby</button>
        <button id="round-setup-toggle" type="button" hidden>Set up race · hold Space</button>
        <span id="round-cancel-hint" hidden>Host: hold Space to cancel race</span>
        <button id="race-leave" type="button">Leave game</button>
      </header>
      <div class="race-stage">
        <div class="game-viewport">
          <canvas id="game" aria-label="Beggar's Grand Prix. Use W to accelerate, A and D to steer, and S to brake or reverse."></canvas>
          <div class="race-left-hud">
          <section id="lap-display" class="lap-display" aria-label="Lap timing">
            <span id="active-track-name" class="active-track-name">Default circuit</span>
            <span class="lap-label">Current</span>
            <output id="lap-current">00:00.00</output>
            <div class="lap-row"><span>Best</span><output id="lap-best">--:--.--</output></div>
            <div class="lap-row"><span>Last</span><output id="lap-last">--:--.--</output></div>
            <output id="lap-delta" class="lap-delta" hidden></output>
            <p id="lap-status">Cross the line to start</p>
          </section>
          <section id="race-leaderboard" class="race-leaderboard" aria-label="Multiplayer leaderboard" hidden>
            <h2>Leaderboard</h2>
            <table><thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Last</th><th scope="col">Best</th><th scope="col">Laps</th></tr></thead><tbody></tbody></table>
          </section>
          </div>
          <canvas id="minimap" class="minimap" role="img" aria-label="Track minimap. The orange arrow shows your car's position and direction; blue marks checkpoints and white marks the finish line."></canvas>
          <div class="race-speed" aria-label="Vehicle speed">
            <span>Speed</span>
            <div><output id="race-speed-value" aria-live="off">0</output> <span id="race-speed-unit">km/h</span></div>
          </div>
          <p class="controls" aria-label="Driving controls">
            <span><kbd>W</kbd> Accelerate</span>
            <span><kbd>A</kbd><kbd>D</kbd> Steer</span>
            <span><kbd>S</kbd> Brake / reverse</span>
          </p>
        </div>
        <aside id="tuning-panel" class="tuning-panel" aria-label="Vehicle tuning"></aside>
      <button id="tuning-toggle" class="tuning-toggle" type="button" aria-controls="tuning-panel" aria-expanded="true">Hide</button>
      </div>
    </main>
    <noscript>Enable JavaScript to play Beggar's Grand Prix.</noscript>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
